name: business_dash
description: "Veroon App - Motorcycle Spare Parts Shop"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.3
  path: ^1.9.1
  pdf: 3.13.0
  printing: 5.15.0
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.0.0
  file_picker: ^13.1.0
  uuid: ^4.6.0
  connectivity_plus: ^7.3.2
  cloud_functions: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/veroon_app_logo.png
    - "assets/veroon profile.jpeg"
    - "assets/veroon logo.png"
    - "assets/developer_icon.png"
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/veroon logo.png"
  min_sdk_android: 21
